<svg width="200" height="200" viewBox="40 40 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock circle (pushed down slightly) -->
  <circle cx="100" cy="108" r="45" 
          fill="none" stroke="black" stroke-width="12"/>
  
  <!-- Button on top (small fat rectangle) -->
  <rect x="85" y="42" width="30" height="8" fill="black"/>
  
  <!-- Button stem (wider, shorter rectangle touching the circle) -->
  <rect x="92" y="49" width="16" height="8" fill="black"/>
  
  <!-- Triangular clock hand (rotated 45 degrees, centered at circle center, 60% size) -->
  <g transform="translate(100, 108)">
    <polygon points="-5,12 5,12 0,-24" fill="#000" transform="translate(6, -6) rotate(45)"/>
  </g>
</svg>